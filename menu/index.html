:root{--disp:'Space Grotesk','IRANYekan',system-ui,sans-serif;--fa:'IRANYekan','Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif;--bg:#fff;--fg:#0d0d0d;--mute:#6a6a6a;--red:#a72b23;--tile:#111;--tfg:#fff;--line:#e4e4e4;--soft:#f3f3f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--fg:#f2f2f2;--mute:#9b9b9b;--red:#d8493f;--tile:#f2f2f2;--tfg:#0d0d0d;--line:#2b2b2b;--soft:#191919}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fa);font-size:16px;line-height:1.75}
.sf{font-family:var(--disp);letter-spacing:.5px}
button{font:inherit;color:inherit}
/* ---------- header / logo ---------- */
header{position:relative;text-align:center;padding:26px 16px 6px}
.lg{position:absolute;inset-inline-start:16px;top:20px;font:700 12px/1 system-ui,sans-serif;background:none;border:1.5px solid var(--fg);border-radius:6px;padding:7px 11px;cursor:pointer;letter-spacing:.4px}
.lg:active{background:var(--fg);color:var(--bg)}
#logo{display:flex;justify-content:center;gap:5px;direction:ltr;margin:30px auto 4px;perspective:700px}
.lt{position:relative;width:clamp(54px,17vw,76px);aspect-ratio:1/1.08;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.5,.5,1);animation:drop .8s cubic-bezier(.3,1.4,.5,1) backwards}
.lt.fl{transform:rotateY(180deg)}
#logo .lt .b{transform:rotateY(180deg);background:var(--red);color:#fff;font:700 clamp(20px,6.5vw,27px)/1 var(--disp)}
@media (hover:hover){.lt:hover{transform:translateY(-3px)}.lt.fl:hover{transform:rotateY(180deg) translateY(-3px)}}
.lt:active{transform:scale(.94)}.lt.fl:active{transform:rotateY(180deg) scale(.94)}
.cap{margin:12px 0 0;min-height:20px;font:600 13.5px/1.4 var(--disp);letter-spacing:.6px;color:var(--red);direction:ltr;opacity:0;transform:translateY(4px);transition:opacity .45s,transform .45s}
.cap.on{opacity:1;transform:none}
.lt:nth-child(2){animation-delay:.08s}.lt:nth-child(3){animation-delay:.16s}.lt:nth-child(4){animation-delay:.24s}.lt:nth-child(5){animation-delay:.32s}
@keyframes drop{from{opacity:0;transform:translateY(-34px) rotate(-8deg)}to{opacity:1;transform:none}}
.lt .f,.lt .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;display:grid;place-items:center;background:var(--tile);color:var(--tfg);box-shadow:0 4px 0 -1px color-mix(in srgb,var(--fg) 22%,transparent)}
.lt i{position:absolute;top:4px;left:6px;font:600 10px/1 var(--disp);font-style:normal}
.lt b{font:700 clamp(26px,8.5vw,36px)/1 var(--disp)}
.lt small{position:absolute;bottom:14px;left:0;right:0;font:500 8px/1 var(--disp);letter-spacing:.3px}
.lt em{position:absolute;bottom:5px;left:0;right:0;font:500 6.5px/1 var(--disp);font-style:normal;opacity:.8}
/* ---------- tile nav ---------- */
#stk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nt{flex:none;position:relative;width:64px;height:74px;border-radius:3px;background:var(--tile);color:var(--tfg);text-decoration:none;display:grid;place-items:center;transition:background .25s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.nt i{position:absolute;top:4px;left:6px;font:600 9px/1 var(--disp);font-style:normal;opacity:.85}
.nt b{font:700 28px/1 var(--disp);margin-top:-8px}
.nt span{position:absolute;bottom:4px;left:3px;right:3px;font-size:11.5px;line-height:1.2;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nt.on{background:var(--red);color:#fff;transform:translateY(-3px)}
.nt:active{transform:scale(.93)}
/* ---------- content ---------- */
.wrap{max-width:700px;margin:0 auto;padding:0 18px 20px}
.search{width:100%;margin:16px 0 0;padding:11px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--soft);color:var(--fg);font:inherit;font-size:15px;outline:none}
.search:focus{border-color:var(--fg)}
section{padding-top:30px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sh .tile{flex:none;position:relative;width:46px;height:50px;border-radius:3px;background:var(--tile);color:var(--tfg);display:grid;place-items:center}
.sh .tile i{position:absolute;top:3px;left:4px;font:600 8px/1 var(--disp);font-style:normal}
.sh .tile b{font:700 20px/1 var(--disp)}
.sh h2{margin:0;font-size:21px;font-weight:700;line-height:1.4}
.sh p{margin:0;font-size:12.5px;color:var(--mute);letter-spacing:.2px}
.tag{margin:2px 0 4px;font-size:13.5px;color:var(--mute)}
.it{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ph{flex:none;width:112px;height:140px;border-radius:14px;overflow:hidden;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}

const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.05}):{observe:x=>x.classList.add('in')};
function filter(){const v=$('q').value.trim().toLowerCase();
  document.querySelectorAll('.it').forEach(el=>el.classList.toggle('hide',!!v&&!el.textContent.toLowerCase().includes(v)));

// ---------- scroll spy ----------
let cur=null,tk=0;
function setSpy(){cur=null;spy()}
function spy(){let id=null,best=-1e9;
  document.querySelectorAll('main section').forEach(x=>{if(x.classList.contains('hide'))return;const t=x.getBoundingClientRect().top;if(t<=160&&t>best){best=t;id=x.id}});
  if(!id||id===cur)return;cur=id;
  document.querySelectorAll('.nt').forEach(a=>{const on=a.dataset.id===id;a.classList.toggle('on',on);
    if(on){const r=a.getBoundingClientRect(),n=$('nav').getBoundingClientRect(),d=(r.left+r.width/2)-(n.left+n.width/2);if(Math.abs(d)>8)$('nav').scrollBy({left:d,behavior:'smooth'})}})}
addEventListener('scroll',()=>{if(!tk){tk=1;requestAnimationFrame(()=>{tk=0;spy();$('totop').classList.toggle('on',scrollY>600)})}},{passive:true});

const SHEET_CSV='';
function parseCSV(t){const R=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
  if(c||r.length){r.push(c);R.push(r)}return R}
const latin=v=>String(v||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
function applyRows(rows){const h=rows.shift().map(x=>x.trim());
  const R=rows.filter(x=>x.length>2).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])));
  if(R.length<5)return false;
  M.forEach(s=>{const rs=R.filter(r=>r.section===s.id&&(r.available||'yes').toLowerCase()!=='no');
    s.i=rs.map(r=>{const so=(r.available||'').toLowerCase()==='soldout',p=latin(r.price);return[r.name_fa,r.desc_fa,so||!p?'':+p,so,r.tags||'']});
    if(EN[s.id])EN[s.id].i=rs.map(r=>[r.name_en||r.name_fa,r.desc_en||''])});return true}
async function loadSheet(){if(!SHEET_CSV)return;
  try{const r=await fetch(SHEET_CSV+(SHEET_CSV.includes('?')?'&':'?')+'t='+Date.now());if(r.ok&&applyRows(parseCSV(await r.text())))render()}catch(e){}}

// ---------- sheet ----------
function sheetHTML(kind){const U=UI[L],C=CFG;
  const head=t=>`<h3>${t}<button type="button" id="shx">${U.close}</button></h3>`;
  if(kind==='hours')return head(U.fh.hours)+C.hours[L].map(r=>`<div class="srow"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  if(kind==='about')return head(U.sh.about)+`<p class="snote" style="font-size:14.5px;line-height:2.15;color:var(--fg)">${C.about[L]}</p>`;
  if(kind==='contact')return head(U.sh.contact)+
    `<a class="slink" href="tel:${C.contact.tel}"><b>${U.tel}:</b> ${C.contact.telShow[L]}</a>`+
    `<a class="slink" href="https://instagram.com/${C.contact.insta}" target="_blank" rel="noopener"><b>${U.insta}:</b> <span dir="ltr">@${C.contact.insta}</span></a>`+
    `<div class="srow"><span>${U.addr}</span><span style="text-align:end">${C.contact.addr[L]}</span></div>`;
  if(kind==='basket'){const rows=BASK.map(([n,q])=>{const p=+priceOf(n)||0;
      return `<div class="srow"><div class="qc"><button type="button" data-pm="-1" data-n="${n}">−</button><b>${num(q)}</b><button type="button" data-pm="1" data-n="${n}">+</button></div><span style="flex:1">${dispName(n)}</span><b>${fmt(q*p)}</b></div>`}).join('');
    return head(U.sh.basket)+(BASK.length?`<p class="snote" style="margin:0 0 6px">${U.ordnote}</p>`+rows+`<div class="srow"><span><b>${U.tot}</b></span><b style="color:var(--red)">${fmt(totP())} ${U.unit}</b></div><div class="sact"><button type="button" id="bcopy">${U.copy}</button><button type="button" class="gh" id="bclear">${U.clear}</button></div>`:`<p class="snote">${U.empty}</p>`)}
  return ''}
function openSheet(kind){$('shc').innerHTML=sheetHTML(kind);$('shc').dataset.kind=kind;
  $('shx').onclick=closeSheet;$('scrim').classList.add('on');$('sheet').classList.add('on');
  const cp=$('bcopy'),cl=$('bclear');
  if(cp)cp.onclick=()=>{const t=BASK.map(([n,q])=>`${dispName(n)} × ${num(q)} — ${fmt(q*(+priceOf(n)||0))}`).join('\n')+`\n${UI[L].tot}: ${fmt(totP())} ${UI[L].unit}`;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent=UI[L].copied}).catch(()=>{cp.textContent=t})};
  if(cl)cl.onclick=()=>{BASK=[];saveB();markSel();updateBasket();openSheet('basket')}}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on')}

    saveB();markSel();updateBasket();openSheet('basket');return}});
// ---------- basket (my selection) ----------
let BASK=[];try{const raw=JSON.parse(localStorage.getItem('cafein-basket')||'[]');
  if(Array.isArray(raw))BASK=raw.map(x=>Array.isArray(x)?[x[0],+x[1]||1]:[x,1]).filter(x=>x&&x[0]);}catch(e){}
if(!Array.isArray(BASK))BASK=[];
function saveB(){try{localStorage.setItem('cafein-basket',JSON.stringify(BASK))}catch(e){}}
function priceOf(n){for(const s of M){for(const it of s.i)if(it[0]===n)return it[2]}return ''}
const fmt=n=>{const s=String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');return L==='fa'?fa(s):s};
const qOf=n=>{const x=BASK.find(y=>y[0]===n);return x?x[1]:0};
function dispName(n){for(const s of M){const i=s.i.findIndex(it=>it[0]===n);if(i>-1){const e=EN[s.id];if(L==='en'&&e&&e.i[i])return e.i[i][0]}}return n}
function addQ(n,d){const x=BASK.find(y=>y[0]===n);
  if(!x){if(d>0)BASK.push([n,d])}else{x[1]+=d;if(x[1]<=0)BASK.splice(BASK.indexOf(x),1)}}
const totQ=()=>BASK.reduce((a,x)=>a+x[1],0);
const totP=()=>BASK.reduce((a,x)=>a+x[1]*(+priceOf(x[0])||0),0);
function markSel(){document.querySelectorAll('.it').forEach(el=>{const q=qOf(el.dataset.n),nm=el.querySelector('.n');
  el.classList.toggle('sel',q>0);if(q>0)nm.setAttribute('data-q',num(q));else nm.removeAttribute('data-q')})}
function updateBasket(){const b=$('basket'),n=totQ();
  b.classList.toggle('on',n>0);b.innerHTML=`<b>${num(n)}</b> ${UI[L].bsk} · <b>${fmt(totP())}</b>`;
  const bd=$('bfab').querySelector('b');bd.textContent=num(n);bd.classList.toggle('hide',n===0)}

  addQ(it.dataset.n,1);if(navigator.vibrate)try{navigator.vibrate(8)}catch(x){}
  saveB();markSel();updateBasket()});
